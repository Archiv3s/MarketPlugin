name: Build SellAxe

on:
  push:
    branches: [main]
    paths:
      - 'SellAxe/**'
      - '.github/workflows/build-sellaxe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # paper-api 26.3 classes are Java 25 bytecode (version 69), so javac needs JDK 25.
      # The jar itself is still compiled to Java 21 bytecode by the flags below.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build jar
        working-directory: SellAxe
        run: mvn -B clean package -Dmaven.compiler.source=21 -Dmaven.compiler.target=21

      - name: Verify listener and permission
        working-directory: SellAxe
        run: |
          javap -p -cp target/SellAxe.jar com.archiv3s.sellaxe.SellAxePlugin | grep onSellAxeHit
          unzip -p target/SellAxe.jar plugin.yml | grep -A2 'sellaxe.use' | grep 'default: true'

      - name: Upload SellAxe.jar
        uses: actions/upload-artifact@v4
        with:
          name: SellAxe-jar
          path: SellAxe/target/SellAxe.jar
